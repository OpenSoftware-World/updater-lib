[build-system]
requires = ["setuptools>=61.0,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "updater-lib"
version = "0.1.0"
description = "A development library for an update manager that developers can use in their own software."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "OpenSoftware-World"}
]
requires-python = ">=3.7"

dependencies = [
    "requests",
]

[project.urls]
Homepage = "https://github.com/OpenSoftware-World/updater-lib"
Source = "https://github.com/OpenSoftware-World/updater-lib"
